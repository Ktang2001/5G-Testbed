cu_cp:
  inactivity_timer:7200
  amf:
    addr: 10.10.1.1
    port: 38412
    bind_addr: 10.10.1.2
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "99970"
            tai_slice_support_list:
              - sst: 1
                sd: 1
              - sst: 2
                sd: 1
              - sst: 3
                sd: 1

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "99970"
  tac: 1
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 12
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
  slicing:
    - sst: 1          # eMBB
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 20
        max_prb_policy_ratio: 100
    - sst: 2          # URLLC
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 30
        max_prb_policy_ratio: 100
    - sst: 3          # mMTC
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 0
        max_prb_policy_ratio: 10

log:
  filename: /tmp/gnb.log
  all_level: warning
